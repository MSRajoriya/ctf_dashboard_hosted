name: Update CTF Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min — GitHub's practical floor for reliable scheduling
  workflow_dispatch: {}       # lets you trigger a manual run from the Actions tab

permissions:
  contents: write             # needed to commit the regenerated index.html

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch CTFtime data and render dashboard
        run: python3 fetch_and_render.py --out index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html calendar.ics
          git diff --staged --quiet || git commit -m "chore: refresh CTF dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
